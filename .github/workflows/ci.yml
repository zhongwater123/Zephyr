name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pr-fast:
    name: PR fast
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - name: Cache Rust dependencies and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Install frontend dependencies
        run: npm ci
      - name: Scan committed credentials
        run: npm run security:secrets
      - name: Test architecture documentation checks
        run: npm run architecture:test
      - name: Check architecture documentation
        run: npm run architecture:check
      - name: Check ASR layer boundaries
        run: npm run architecture:asr
      - name: Build frontend
        run: npm run build
      - name: Test frontend
        run: npm test
      - name: Check Rust formatting
        working-directory: src-tauri
        run: cargo fmt --check
      - name: Test Rust library
        working-directory: src-tauri
        run: cargo test --lib --all-features

  full-main:
    name: Full engineering checks
    if: github.event_name != 'pull_request'
    needs: pr-fast
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - name: Cache Rust dependencies and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Install frontend dependencies
        run: npm ci
      - name: Test architecture documentation checks
        run: npm run architecture:test
      - name: Report architecture impact for push
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: npm run architecture:impact -- --base "${{ github.event.before }}"
      - name: Check architecture documentation
        run: npm run architecture:check
      - name: Check ASR layer boundaries
        run: npm run architecture:asr
      - name: Lint Rust
        working-directory: src-tauri
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test Rust all targets
        working-directory: src-tauri
        run: cargo test --all-features
