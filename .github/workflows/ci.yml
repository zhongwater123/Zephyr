name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pr-fast:
    name: PR fast
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - name: Cache Rust dependencies and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Install frontend dependencies
        run: npm ci
      - name: Scan committed credentials
        run: npm run security:secrets
      - name: Test architecture documentation checks
        run: npm run architecture:test
      - name: Check architecture documentation
        run: npm run architecture:check
      - name: Check ASR layer boundaries
        run: npm run architecture:asr
      - name: Check shared platform boundaries
        run: npm run architecture:platform
      - name: Build frontend
        run: npm run build
      - name: Test frontend
        run: npm test
      - name: Check Rust formatting
        working-directory: src-tauri
        run: cargo fmt --check
      - name: Test Rust library
        working-directory: src-tauri
        run: cargo test --lib --all-features

  macos-arm64:
    name: macOS 15 Apple Silicon
    runs-on: macos-15
    timeout-minutes: 35
    env:
      MACOSX_DEPLOYMENT_TARGET: "15.0"
      APPLE_SIGNING_IDENTITY: "-"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Report host toolchain
        run: |
          sw_vers
          uname -m
          xcodebuild -version
          rustc --version
      - name: Require Apple Silicon host
        run: test "$(uname -m)" = "arm64"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
          targets: aarch64-apple-darwin
      - name: Cache Rust dependencies and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: macos-arm64-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            macos-arm64-cargo-
      - name: Install frontend dependencies
        run: npm ci
      - name: Check shared platform boundaries
        run: npm run architecture:platform
      - name: Build and test frontend
        run: |
          npm run build
          npm test
      - name: Check Rust formatting
        working-directory: src-tauri
        run: cargo fmt --check
      - name: Lint macOS Rust targets
        working-directory: src-tauri
        run: cargo clippy --target aarch64-apple-darwin --all-targets -- -D warnings
      - name: Test Rust library
        working-directory: src-tauri
        run: cargo test --lib
      - name: Build ad-hoc signed app bundle
        run: npm run tauri -- build --bundles app
      - name: Verify app bundle
        run: |
          APP_PATH="$(find src-tauri/target/release/bundle/macos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          test -d "$APP_PATH"
          INFO_PLIST="$APP_PATH/Contents/Info.plist"
          plutil -lint "$INFO_PLIST"

          EXECUTABLE_NAME="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$INFO_PLIST")"
          EXECUTABLE_PATH="$APP_PATH/Contents/MacOS/$EXECUTABLE_NAME"
          test -x "$EXECUTABLE_PATH"
          test "$(lipo -archs "$EXECUTABLE_PATH")" = "arm64"

          MINIMUM_SYSTEM_VERSION="$(otool -l "$EXECUTABLE_PATH" | awk '$1 == "cmd" && $2 == "LC_BUILD_VERSION" { in_build_version=1; next } in_build_version && $1 == "minos" { print $2; exit }')"
          test "$MINIMUM_SYSTEM_VERSION" = "15.0"
          test "$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$INFO_PLIST")" = "15.0"

          MICROPHONE_USAGE="$(/usr/libexec/PlistBuddy -c 'Print :NSMicrophoneUsageDescription' "$INFO_PLIST")"
          test -n "$(printf '%s' "$MICROPHONE_USAGE" | tr -d '[:space:]')"
          test -z "$(find "$APP_PATH" -iname '*paste-helper*' -print -quit)"

          codesign --verify --deep --strict "$APP_PATH"

          SMOKE_LOG="$RUNNER_TEMP/zephyr-macos-smoke.log"
          "$EXECUTABLE_PATH" >"$SMOKE_LOG" 2>&1 &
          APP_PID=$!
          sleep 8
          if ! kill -0 "$APP_PID" 2>/dev/null; then
            cat "$SMOKE_LOG"
            wait "$APP_PID" || true
            exit 1
          fi
          kill -TERM "$APP_PID"
          for _ in $(seq 1 20); do
            if ! kill -0 "$APP_PID" 2>/dev/null; then
              break
            fi
            sleep 0.5
          done
          if kill -0 "$APP_PID" 2>/dev/null; then
            cat "$SMOKE_LOG"
            kill -KILL "$APP_PID" || true
            wait "$APP_PID" || true
            exit 1
          fi
          wait "$APP_PID" || true

          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" Zephyr-macos-arm64.app.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Zephyr-macos-arm64-app
          path: Zephyr-macos-arm64.app.zip
          if-no-files-found: error

  full-main:
    name: Full engineering checks
    if: github.event_name != 'pull_request'
    needs: pr-fast
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - name: Cache Rust dependencies and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Install frontend dependencies
        run: npm ci
      - name: Test architecture documentation checks
        run: npm run architecture:test
      - name: Report architecture impact for push
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: npm run architecture:impact -- --base "${{ github.event.before }}"
      - name: Check architecture documentation
        run: npm run architecture:check
      - name: Check ASR layer boundaries
        run: npm run architecture:asr
      - name: Check shared platform boundaries
        run: npm run architecture:platform
      - name: Lint Rust
        working-directory: src-tauri
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test Rust all targets
        working-directory: src-tauri
        run: cargo test --all-features
      - name: Verify Windows packaging contract
        run: npm run package:windows:check
