name: CI

on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - name: Install frontend dependencies
      - name: Test architecture documentation checks
        run: npm run architecture:test
      - name: Report architecture impact for pull request
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: npm run architecture:impact -- --base "origin/${{ github.base_ref }}"
      - name: Report architecture impact for push
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        continue-on-error: true
        run: npm run architecture:impact -- --base "${{ github.event.before }}"
        run: npm ci
      - name: Check architecture documentation
        run: npm run architecture:check
      - name: Check ASR layer boundaries
        run: npm run architecture:asr
      - name: Scan committed credentials
        run: npm run security:secrets
      - name: Build frontend
        run: npm run build
      - name: Test frontend
        run: npm test
      - name: Check Rust formatting
        working-directory: src-tauri
        run: cargo fmt --check
      - name: Lint Rust
        working-directory: src-tauri
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test Rust
        working-directory: src-tauri
        run: cargo test --all-features
